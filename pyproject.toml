[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lingodeck-forge"
version = "0.1.0"
description = "Agent harness for turning teaching materials into grounded Anki and LingoDeck decks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["genanki>=0.13.1,<0.14", "pydantic>=2.11,<3", "pypdf>=6,<7", "python-docx>=1.1,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
deck-forge = "deck_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deck_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
