name: Test harness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Verify installed wheel and offline lesson build
        shell: bash
        run: |
          uv build --out-dir "$RUNNER_TEMP/forge-dist"
          uv venv "$RUNNER_TEMP/forge-venv"
          uv pip install --python "$RUNNER_TEMP/forge-venv/bin/python" "$RUNNER_TEMP"/forge-dist/*.whl
          cd "$RUNNER_TEMP"
          forge_bin="$RUNNER_TEMP/forge-venv/bin"
          "$forge_bin/lingodeck-forge" --version
          "$forge_bin/deck-forge" doctor
          "$forge_bin/python" "$GITHUB_WORKSPACE/examples/create_demo.py" lesson
          "$forge_bin/lingodeck-forge" build lesson --output lesson/dist/check.apkg
